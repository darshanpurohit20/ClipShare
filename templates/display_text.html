<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClipShare — Shared Text</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/png" href="/static/images/logow.png" />
</head>
<body class="dark-mode">

  <!-- ── Topbar ── -->
  <nav class="cs-topbar">
    <a class="cs-topbar-brand" href="/">
      <img id="clipshare-logo" src="/static/images/logow.png" alt="ClipShare">
      <span>ClipShare</span>
    </a>
    <div class="cs-topbar-actions">
      <a href="/" class="cs-icon-btn" title="Home" style="text-decoration:none;">
        <i class="fas fa-house"></i>
      </a>
      <button class="cs-icon-btn" id="theme-toggle" title="Toggle theme">
        <i id="theme-icon" class="fas fa-moon"></i>
      </button>
    </div>
  </nav>

  <!-- ── Content ── -->
  <div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:90px 16px 60px;position:relative;z-index:1;">
    <div style="width:100%;max-width:720px;">

      <!-- Header row -->
      <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <div>
          <div class="success-badge" style="margin-bottom:8px;">
            <i class="fas fa-file-lines"></i> Text Clip
          </div>
          <h2 style="font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;margin:0;">Shared Text</h2>
          {% if expiry_msg %}
          <div style="font-size:0.75rem;color:#f87171;margin-top:4px;"><i class="fas fa-clock me-1"></i>{{ expiry_msg }}</div>
          {% endif %}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="copyTextBtn" class="btn-action-primary">
            <i class="fas fa-copy"></i> Copy Text
          </button>
          <span id="copyTextMsg" class="d-none" style="font-size:0.78rem;font-weight:600;color:var(--accent-2);background:rgba(168,255,87,0.12);border-radius:50px;padding:4px 12px;">Copied!</span>
        </div>
      </div>

      <!-- Text card -->
      <div class="panel-card fade-in fade-in-delay-1" style="padding:0;overflow:hidden;">
        <!-- Toolbar -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);">
          <span style="font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--text-muted);">
            <i class="fas fa-terminal me-1"></i> Content
          </span>
          <span style="font-size:0.7rem;color:var(--text-muted);">plain text</span>
        </div>
        <pre id="sharedText" class="p-4 text-start mb-0" style="white-space:pre-wrap;overflow-x:auto;">{{ text }}</pre>
      </div>

      <!-- Back link -->
      <div class="fade-in fade-in-delay-2" style="text-align:center;margin-top:28px;">
        <a href="/" class="btn-action-outline" style="text-decoration:none;">
          <i class="fas fa-plus"></i> New Transfer
        </a>
      </div>

    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const logo      = document.getElementById('clipshare-logo');

      (function applyTheme() {
        const saved  = localStorage.getItem('theme');
        const isDark = saved === null ? true : saved === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        if (themeIcon) themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        if (logo) logo.src = isDark ? '/static/images/logow.png' : '/static/images/logob.png';
      })();

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.body.classList.toggle('dark-mode');
          const isDark = document.body.classList.contains('dark-mode');
          if (themeIcon) themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
          if (logo) logo.src = isDark ? '/static/images/logow.png' : '/static/images/logob.png';
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      }

      const copyBtn    = document.getElementById("copyTextBtn");
      const copyMsg    = document.getElementById("copyTextMsg");
      const sharedText = document.getElementById("sharedText");

      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          const text = sharedText ? sharedText.innerText : '';
          function flash() {
            if (!copyMsg) return;
            copyMsg.classList.remove('d-none');
            setTimeout(() => copyMsg.classList.add('d-none'), 2000);
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(flash).catch(() => {
              fallback(text);
            });
          } else {
            fallback(text);
          }
          function fallback(t) {
            const tmp = document.createElement('textarea');
            tmp.value = t;
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand('copy'); flash(); } catch (_) {}
            document.body.removeChild(tmp);
          }
        });
      }
    });
  </script>
</body>
</html>
